name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Red 3.5.24
        run: python -m pip install "Red-DiscordBot==3.5.24"
      - name: Compile cog
        run: python -m compileall -q reverbraid
      - name: Import cog
        run: python -c "from reverbraid.reverbraid import ReverbRaid; print(ReverbRaid.__version__)"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
